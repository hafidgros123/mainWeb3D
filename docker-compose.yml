services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env.docker}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env.docker}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.docker}
      GEMINI_MODEL: ${GEMINI_MODEL:?Set GEMINI_MODEL in .env.docker}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in .env.docker}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in .env.docker}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
